<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#8A8A8A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="pa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#8E82CE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ttl { fill:#2b2b2b; font-size:25px; font-weight:700; }
      .hdr { fill:#3a3a3a; font-size:20px; font-weight:700; }
      .cap { fill:#4a4a4a; font-size:16px; }
      .bt  { font-size:18px; font-weight:700; }
      .bd  { fill:#3a3a3a; font-size:15px; }
      .sm  { fill:#7a7a7a; font-size:14px; }
      .mlp { fill:#2f5fa0; font-size:15px; font-weight:700; }
    </style>
  </defs>

  <text class="ttl" x="40" y="42">Deep Retrieval 算法总览</text>

  <!-- ===== BAND 1 : TRAINING (EM) ===== -->
  <text class="hdr" x="40" y="80">① 训练:EM 交替更新</text>

  <rect x="40" y="100" width="160" height="84" rx="14" fill="#EAE6DB" stroke="#C9C0A8" stroke-width="2"/>
  <text class="bt" x="120" y="136" text-anchor="middle" fill="#2b2b2b">点击数据</text>
  <text class="bd" x="120" y="162" text-anchor="middle">(user, item)</text>
  <line x1="200" y1="142" x2="238" y2="142" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="242" y="92" width="248" height="110" rx="14" fill="#E7EFFB" stroke="#9CBCE8" stroke-width="2"/>
  <text class="bt" x="366" y="124" text-anchor="middle" fill="#2f5fa0">E 步 &#183; 固定 &#960;</text>
  <text class="bd" x="366" y="152" text-anchor="middle">用 item 的 path 当标签</text>
  <text class="bd" x="366" y="176" text-anchor="middle">梯度训练 MLP + 节点 embedding</text>

  <text class="sm" x="509" y="112" text-anchor="middle">EM</text>
  <path d="M488,132 Q509,116 530,132" fill="none" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>
  <path d="M530,164 Q509,180 488,164" fill="none" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="528" y="92" width="248" height="110" rx="14" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <text class="bt" x="652" y="124" text-anchor="middle" fill="#2E8B60">M 步 &#183; 固定网络</text>
  <text class="bd" x="652" y="152" text-anchor="middle">点过 item 的用户给 path 打分</text>
  <text class="bd" x="652" y="176" text-anchor="middle">取 top-J + 负载均衡惩罚</text>
  <line x1="776" y1="147" x2="812" y2="147" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="816" y="104" width="250" height="86" rx="14" fill="#E8E4F8" stroke="#B0A6DD" stroke-width="2"/>
  <text class="bt" x="941" y="134" text-anchor="middle" fill="#4A3F9E">学到</text>
  <text class="bd" x="941" y="160" text-anchor="middle">网络 + 节点 embedding</text>
  <text class="bd" x="941" y="182" text-anchor="middle">&#960;:item &#8594; J 条 path</text>

  <!-- ===== BAND 2 : THE NETWORK (shared) ===== -->
  <text class="hdr" x="40" y="228">网络架构(训练与召回共用)</text>

  <!-- learned-network arrow down from output -->
  <path d="M900,190 C860,214 800,224 760,258" fill="none" stroke="#B0A6DD" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ga)"/>

  <path d="M286,252 Q400,236 512,252" fill="none" stroke="#8E82CE" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#pa)"/>

  <rect x="40" y="258" width="104" height="54" rx="12" fill="#EAE6DB" stroke="#C9C0A8" stroke-width="2"/>
  <text class="bt" x="92" y="290" text-anchor="middle" fill="#2b2b2b">emb(x)</text>
  <line x1="144" y1="285" x2="172" y2="285" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="176" y="261" width="64" height="48" rx="10" fill="#E7EFFB" stroke="#9CBCE8" stroke-width="2"/>
  <text class="mlp" x="208" y="290" text-anchor="middle">MLP&#8321;</text>
  <line x1="240" y1="285" x2="266" y2="285" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <circle cx="286" cy="265" r="12" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <circle cx="286" cy="285" r="12" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <circle cx="286" cy="305" r="12" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <line x1="300" y1="285" x2="326" y2="285" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="330" y="261" width="64" height="48" rx="10" fill="#E7EFFB" stroke="#9CBCE8" stroke-width="2"/>
  <text class="mlp" x="362" y="290" text-anchor="middle">MLP&#8322;</text>
  <line x1="394" y1="285" x2="420" y2="285" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <circle cx="440" cy="265" r="12" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <circle cx="440" cy="285" r="12" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <circle cx="440" cy="305" r="12" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <line x1="454" y1="285" x2="480" y2="285" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="484" y="261" width="64" height="48" rx="10" fill="#E7EFFB" stroke="#9CBCE8" stroke-width="2"/>
  <text class="mlp" x="516" y="290" text-anchor="middle">MLP&#8323;</text>
  <line x1="548" y1="285" x2="574" y2="285" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <circle cx="594" cy="265" r="12" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <circle cx="594" cy="285" r="12" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <circle cx="594" cy="305" r="12" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <line x1="608" y1="285" x2="634" y2="285" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="638" y="260" width="150" height="50" rx="12" fill="#E8E4F8" stroke="#B0A6DD" stroke-width="2"/>
  <text class="bt" x="713" y="290" text-anchor="middle" fill="#4A3F9E">path [36,27,20]</text>

  <text x="812" y="272" font-size="15" font-weight="700" fill="#2f5fa0">每层一个 MLP(共 D 层)</text>
  <text x="812" y="295" font-size="15" font-weight="700" fill="#2E8B60">每个节点 = 一个可训练 embedding</text>
  <text x="812" y="318" font-size="14" fill="#6E62B8">早层节点 embedding 前向拼接到后层</text>

  <!-- arrow: network -> beam search -->
  <path d="M334,312 L334,436" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ga)"/>
  <text class="sm" x="430" y="390" text-anchor="start">召回时 beam search 走此网络</text>

  <!-- ===== BAND 3 : SERVING ===== -->
  <text class="hdr" x="40" y="416">② 在线召回</text>

  <rect x="40" y="440" width="150" height="72" rx="14" fill="#EAE6DB" stroke="#C9C0A8" stroke-width="2"/>
  <text class="bt" x="115" y="482" text-anchor="middle" fill="#2b2b2b">user x</text>
  <line x1="190" y1="476" x2="230" y2="476" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="234" y="436" width="200" height="80" rx="14" fill="#E7EFFB" stroke="#9CBCE8" stroke-width="2"/>
  <text class="bt" x="334" y="469" text-anchor="middle" fill="#2f5fa0">逐层 MLP</text>
  <text class="bd" x="334" y="494" text-anchor="middle">beam search</text>
  <line x1="434" y1="476" x2="474" y2="476" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="478" y="440" width="170" height="72" rx="14" fill="#E8E4F8" stroke="#B0A6DD" stroke-width="2"/>
  <text class="bt" x="563" y="482" text-anchor="middle" fill="#4A3F9E">top-b 条 path</text>
  <line x1="648" y1="476" x2="688" y2="476" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="692" y="436" width="210" height="80" rx="14" fill="#FBE7DF" stroke="#E3A98F" stroke-width="2"/>
  <text class="bt" x="797" y="469" text-anchor="middle" fill="#C0512F">倒排索引</text>
  <text class="bd" x="797" y="494" text-anchor="middle">path &#8594; items</text>
  <text class="sm" x="797" y="534" text-anchor="middle">(由 &#960; 构建)</text>
  <line x1="902" y1="476" x2="942" y2="476" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="946" y="440" width="170" height="72" rx="14" fill="#DFF0E6" stroke="#7BC29B" stroke-width="2"/>
  <text class="bt" x="1031" y="473" text-anchor="middle" fill="#2E8B60">item 候选集</text>
  <text class="sm" x="1031" y="498" text-anchor="middle">&#8594; 精排</text>

  <text class="cap" x="580" y="580" text-anchor="middle">训练与召回共用同一网络:E 步训练它,beam search 走它得到 path;&#960; 决定 item 挂在哪条 path</text>
</svg>
